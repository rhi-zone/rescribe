format-slideous = ["write-slideous"]

read-t2t = ["dep:t2t", "t2t/rescribe", "t2t/read"]
write-t2t = ["dep:t2t", "t2t/rescribe", "t2t/write"]
format-t2t = ["read-t2t", "write-t2t"]

read-tei = ["dep:tei-fmt", "tei-fmt/rescribe", "tei-fmt/read"]
write-tei = ["dep:tei-fmt", "tei-fmt/rescribe", "tei-fmt/write"]
format-tei = ["read-tei", "write-tei"]

