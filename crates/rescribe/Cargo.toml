[package]
name = "rescribe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Universal document conversion library with fidelity tracking"
keywords = ["document", "conversion", "pandoc", "markdown", "html"]
categories = ["text-processing", "parser-implementations"]

[features]
default = ["std", "format-markdown", "format-html"]

# Node definition crates (not language features — no format- prefix)
std = ["dep:rescribe-std"]
math = ["dep:rescribe-math"]

# jq-style querying of the document IR (embeds the `jaq` engine). Not part of
# `all` — deliberately opt-in so library consumers who don't want a jq engine
# linked in don't pay for it. Requires rescribe-core's `serde` feature.
query = ["rescribe-core/serde", "dep:jaq-core", "dep:jaq-std", "dep:jaq-json", "dep:serde_json", "dep:thiserror"]

# Granular read/write features, one per format.
# Use format-{fmt} to enable both directions at once.
read-ansi = ["dep:ansi-fmt", "ansi-fmt/rescribe", "ansi-fmt/read"]
write-ansi = ["dep:ansi-fmt", "ansi-fmt/rescribe", "ansi-fmt/write"]
format-ansi = ["read-ansi", "write-ansi"]

read-asciidoc = ["dep:asciidoc", "asciidoc/rescribe", "asciidoc/read"]
write-asciidoc = ["dep:asciidoc", "asciidoc/rescribe", "asciidoc/write"]
format-asciidoc = ["read-asciidoc", "write-asciidoc"]

read-bbcode = ["dep:bbcode-fmt", "bbcode-fmt/rescribe", "bbcode-fmt/read"]
write-bbcode = ["dep:bbcode-fmt", "bbcode-fmt/rescribe", "bbcode-fmt/write"]
format-bbcode = ["read-bbcode", "write-bbcode"]

read-biblatex = ["dep:rescribe-fmt-biblatex"]
write-biblatex = ["dep:rescribe-fmt-biblatex"]
format-biblatex = ["read-biblatex", "write-biblatex"]

read-bibtex = ["dep:rescribe-fmt-bibtex"]
write-bibtex = ["dep:rescribe-fmt-bibtex"]
format-bibtex = ["read-bibtex", "write-bibtex"]

write-beamer = ["dep:rescribe-write-beamer"]
format-beamer = ["write-beamer"]

write-chunkedhtml = ["dep:rescribe-write-chunkedhtml"]
format-chunkedhtml = ["write-chunkedhtml"]

read-commonmark = ["dep:rescribe-read-commonmark"]
write-commonmark = ["dep:rescribe-write-commonmark"]
format-commonmark = ["read-commonmark", "write-commonmark"]

write-context = ["dep:rescribe-write-context"]
format-context = ["write-context"]

read-creole = ["dep:creole", "creole/rescribe", "creole/read"]
write-creole = ["dep:creole", "creole/rescribe", "creole/write"]
format-creole = ["read-creole", "write-creole"]

read-csl-json = ["dep:rescribe-fmt-csl-json"]
write-csl-json = ["dep:rescribe-fmt-csl-json"]
format-csl-json = ["read-csl-json", "write-csl-json"]

read-csv = ["dep:csv-fmt", "csv-fmt/rescribe"]
write-csv = ["dep:csv-fmt", "csv-fmt/rescribe"]
format-csv = ["read-csv", "write-csv"]

read-djot = ["dep:djot-fmt", "djot-fmt/rescribe", "djot-fmt/read"]
write-djot = ["dep:djot-fmt", "djot-fmt/rescribe", "djot-fmt/write"]
format-djot = ["read-djot", "write-djot"]

read-docbook = ["dep:docbook-fmt", "docbook-fmt/rescribe", "docbook-fmt/read"]
write-docbook = ["dep:docbook-fmt", "docbook-fmt/rescribe", "docbook-fmt/write"]
format-docbook = ["read-docbook", "write-docbook"]

read-docx = ["dep:rescribe-fmt-ooxml", "rescribe-fmt-ooxml/docx"]
write-docx = ["dep:rescribe-fmt-ooxml", "rescribe-fmt-ooxml/docx"]
format-docx = ["read-docx", "write-docx"]

read-dokuwiki = ["dep:dokuwiki", "dokuwiki/rescribe", "dokuwiki/read"]
write-dokuwiki = ["dep:dokuwiki", "dokuwiki/rescribe", "dokuwiki/write"]
