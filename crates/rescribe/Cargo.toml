read-fb2 = ["dep:fb2-fmt", "fb2-fmt/rescribe", "fb2-fmt/read"]
write-fb2 = ["dep:fb2-fmt", "fb2-fmt/rescribe", "fb2-fmt/write"]
format-fb2 = ["read-fb2", "write-fb2"]

read-fountain = ["dep:fountain-fmt", "fountain-fmt/rescribe", "fountain-fmt/read"]
write-fountain = ["dep:fountain-fmt", "fountain-fmt/rescribe", "fountain-fmt/write"]
