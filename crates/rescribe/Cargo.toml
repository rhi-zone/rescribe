write-twiki = ["dep:twiki", "twiki/rescribe", "twiki/write"]
format-twiki = ["read-twiki", "write-twiki"]

read-typst = ["dep:typst-fmt", "typst-fmt/rescribe", "typst-fmt/read"]
write-typst = ["dep:typst-fmt", "typst-fmt/rescribe", "typst-fmt/write"]
format-typst = ["read-typst", "write-typst"]

read-vimwiki = ["dep:vimwiki-fmt", "vimwiki-fmt/rescribe", "vimwiki-fmt/read"]
write-vimwiki = ["dep:vimwiki-fmt", "vimwiki-fmt/rescribe", "vimwiki-fmt/write"]
format-vimwiki = ["read-vimwiki", "write-vimwiki"]

read-xlsx = ["dep:rescribe-fmt-ooxml", "rescribe-fmt-ooxml/xlsx"]
write-xlsx = ["dep:rescribe-fmt-ooxml", "rescribe-fmt-ooxml/xlsx"]
format-xlsx = ["read-xlsx", "write-xlsx"]

read-xwiki = ["dep:xwiki", "xwiki/rescribe", "xwiki/read"]
write-xwiki = ["dep:xwiki", "xwiki/rescribe", "xwiki/write"]
format-xwiki = ["read-xwiki", "write-xwiki"]

read-zimwiki = ["dep:zimwiki", "zimwiki/rescribe", "zimwiki/read"]
write-zimwiki = ["dep:zimwiki", "zimwiki/rescribe", "zimwiki/write"]
format-zimwiki = ["read-zimwiki", "write-zimwiki"]

# Format groups — non-disjoint; a format may appear in multiple groups.
# `all` is defined as the union of all groups, so coverage is self-verifying.

# Lightweight human-written markup languages.
formats-markup = [
    "format-asciidoc", "format-commonmark", "format-djot", "format-fountain",
    "format-gfm", "format-man", "format-markdown", "format-markdown-strict",
    "format-markua", "format-multimarkdown", "format-muse", "format-org",
    "format-pod", "format-rst", "format-t2t", "format-textile",
]

# Wiki and community markup dialects.
formats-wiki = [
    "format-bbcode", "format-creole", "format-dokuwiki", "format-haddock",
    "format-jira", "format-mediawiki", "format-muse", "format-tikiwiki",
    "format-twiki", "format-vimwiki", "format-xwiki", "format-zimwiki",
]

# Rich/structured document formats (office, XML, binary).
formats-document = [
    "format-docbook", "format-docx", "format-epub", "format-fb2",
    "format-html", "format-ipynb", "format-jats", "format-odt",
    "format-opml", "format-pdf", "format-rtf", "format-tei",
]

# Tabular / spreadsheet formats.
formats-spreadsheet = [
    "format-csv", "format-tsv", "format-xlsx",
]

# Presentation / slideshow formats.
formats-presentation = [
    "format-beamer", "format-dzslides", "format-pptx", "format-revealjs",
    "format-s5", "format-slidy", "format-slideous",
]

# Typesetting and publishing formats.
formats-typesetting = [
    "format-beamer", "format-context", "format-icml", "format-latex",
    "format-ms", "format-texinfo", "format-typst",
]

# Bibliographic reference formats.
formats-bibliography = [
    "format-biblatex", "format-bibtex", "format-csl-json",
    "format-endnotexml", "format-ris",
]

# Formats that don't fit neatly into the above groups.
formats-other = [
    "format-ansi", "format-chunkedhtml", "format-native",
    "format-pandoc-json", "format-plaintext",
]

# All formats — union of all group features.
all = [
    "std", "math",
    "formats-markup", "formats-wiki", "formats-document",
    "formats-spreadsheet", "formats-presentation", "formats-typesetting",
    "formats-bibliography", "formats-other",
]

[dependencies]
# Core is always included
rescribe-core = { workspace = true }

# jq-style querying (optional, see `query` feature above)
jaq-core = { workspace = true, optional = true }
jaq-std = { workspace = true, optional = true }
jaq-json = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

# Node definitions (optional)
rescribe-std = { workspace = true, optional = true }
rescribe-math = { workspace = true, optional = true }

# Readers (optional)
rescribe-read-markdown = { workspace = true, optional = true }
html-fmt = { workspace = true, optional = true }
rescribe-read-latex = { workspace = true, optional = true }
org-fmt = { workspace = true, optional = true }
rescribe-fmt-pdf = { workspace = true, optional = true }
rescribe-fmt-ipynb = { workspace = true, optional = true }
epub-fmt = { workspace = true, optional = true }
djot-fmt = { workspace = true, optional = true }
opml-fmt = { workspace = true, optional = true }
# Covers docx/pptx/xlsx reading AND writing — see the single dep entry below
# (rescribe-fmt-ooxml consolidates what were rescribe-read-docx,
# rescribe-write-docx, rescribe-read-pptx, rescribe-write-pptx,
# rescribe-read-xlsx, rescribe-write-xlsx into one crate with a Cargo
# feature per format).
rescribe-fmt-ooxml = { workspace = true, optional = true }
mediawiki-fmt = { workspace = true, optional = true }
rescribe-fmt-bibtex = { workspace = true, optional = true }
rescribe-fmt-csl-json = { workspace = true, optional = true }
docbook-fmt = { workspace = true, optional = true }
rst-fmt = { workspace = true, optional = true }
asciidoc = { workspace = true, optional = true }
typst-fmt = { workspace = true, optional = true }
dokuwiki = { workspace = true, optional = true }
jats-fmt = { workspace = true, optional = true }
tei-fmt = { workspace = true, optional = true }
man-fmt = { workspace = true, optional = true }
jira-fmt = { workspace = true, optional = true }
creole = { workspace = true, optional = true }
textile-fmt = { workspace = true, optional = true }
haddock-fmt = { workspace = true, optional = true }
muse-fmt = { workspace = true, optional = true }
t2t = { workspace = true, optional = true }
rtf-fmt = { workspace = true, optional = true }
vimwiki-fmt = { workspace = true, optional = true }
zimwiki = { workspace = true, optional = true }
pod-fmt = { workspace = true, optional = true }
markua = { workspace = true, optional = true }
fb2-fmt = { workspace = true, optional = true }
texinfo = { workspace = true, optional = true }
tikiwiki = { workspace = true, optional = true }
twiki = { workspace = true, optional = true }
xwiki = { workspace = true, optional = true }
bbcode-fmt = { workspace = true, optional = true }
ansi-fmt = { workspace = true, optional = true }
csv-fmt = { workspace = true, optional = true }
tsv-fmt = { workspace = true, optional = true }
native = { workspace = true, optional = true }
odf-fmt = { workspace = true, optional = true }
rescribe-read-commonmark = { workspace = true, optional = true }
rescribe-read-gfm = { workspace = true, optional = true }
ris = { workspace = true, optional = true }
endnotexml-fmt = { workspace = true, optional = true }
rescribe-fmt-biblatex = { workspace = true, optional = true }
rescribe-read-markdown-strict = { workspace = true, optional = true }
multimarkdown-fmt = { workspace = true, optional = true }
fountain-fmt = { workspace = true, optional = true }
rescribe-fmt-pandoc-json = { workspace = true, optional = true }

# Writers (optional)
rescribe-write-markdown = { workspace = true, optional = true }
rescribe-write-latex = { workspace = true, optional = true }
rescribe-write-plaintext = { workspace = true, optional = true }
rescribe-write-revealjs = { workspace = true, optional = true }
rescribe-write-slidy = { workspace = true, optional = true }
rescribe-write-s5 = { workspace = true, optional = true }
rescribe-write-dzslides = { workspace = true, optional = true }
rescribe-write-beamer = { workspace = true, optional = true }
rescribe-write-context = { workspace = true, optional = true }
rescribe-write-ms = { workspace = true, optional = true }
rescribe-write-chunkedhtml = { workspace = true, optional = true }
rescribe-write-icml = { workspace = true, optional = true }
rescribe-write-slideous = { workspace = true, optional = true }
