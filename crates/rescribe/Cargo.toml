read-jats = ["dep:jats-fmt", "jats-fmt/rescribe", "jats-fmt/read"]
write-jats = ["dep:jats-fmt", "jats-fmt/rescribe", "jats-fmt/write"]
format-jats = ["read-jats", "write-jats"]

read-jira = ["dep:jira-fmt", "jira-fmt/rescribe", "jira-fmt/read"]
write-jira = ["dep:jira-fmt", "jira-fmt/rescribe", "jira-fmt/write"]
format-jira = ["read-jira", "write-jira"]

read-latex = ["dep:rescribe-read-latex"]
write-latex = ["dep:rescribe-write-latex"]
format-latex = ["read-latex", "write-latex"]

read-man = ["dep:man-fmt", "man-fmt/rescribe", "man-fmt/read"]
write-man = ["dep:man-fmt", "man-fmt/rescribe", "man-fmt/write"]
format-man = ["read-man", "write-man"]

read-markdown = ["dep:rescribe-read-markdown"]
write-markdown = ["dep:rescribe-write-markdown"]
