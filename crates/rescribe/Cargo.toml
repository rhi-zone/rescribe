write-tikiwiki = ["dep:tikiwiki", "tikiwiki/rescribe", "tikiwiki/write"]
format-tikiwiki = ["read-tikiwiki", "write-tikiwiki"]

read-tsv = ["dep:tsv-fmt", "tsv-fmt/rescribe", "tsv-fmt/read"]
write-tsv = ["dep:tsv-fmt", "tsv-fmt/rescribe", "tsv-fmt/write"]
format-tsv = ["read-tsv", "write-tsv"]

