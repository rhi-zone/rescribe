[package]
name = "rescribe-read-jats"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "JATS XML reader for rescribe"

[dependencies]
rescribe-core.workspace = true
rescribe-std.workspace = true
rescribe-format-api.workspace = true
jats-fmt.workspace = true

[dev-dependencies]
# The spec-derived construct registry supplies the coverage denominator for
# `tests/registry_coverage.rs`. Dev-only: it is not needed to read JATS.
jats-fmt = { workspace = true, features = ["registry"] }
