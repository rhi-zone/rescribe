[package]
name = "ris"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "RIS citation format parser, AST, and builder — no rescribe dependency"

[features]
default = []
# AST<->rescribe::Document translation. Off by default so consumers who only
# want the standalone RIS library never pull in rescribe-core.
rescribe = ["dep:rescribe-core", "dep:rescribe-std"]

[dependencies]
rescribe-core = { workspace = true, optional = true }
rescribe-std = { workspace = true, optional = true }
