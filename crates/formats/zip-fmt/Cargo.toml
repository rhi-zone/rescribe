[package]
name = "zip-fmt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ZIP container reader/writer with a domain-typed archive/entry AST and a genuinely incremental push-streaming reader — no rescribe dependency"
readme.workspace = true
keywords = ["zip", "archive", "epub", "ooxml", "streaming"]
categories = ["encoding", "parser-implementations", "compression"]

[features]
default = ["reader-ast", "reader-streaming", "reader-batch", "writer-streaming", "writer-builder"]
reader-ast = ["dep:zip"]
reader-streaming = ["dep:zip"]
reader-batch = ["dep:flate2"]
writer-streaming = ["dep:zip"]
writer-builder = ["reader-ast", "writer-streaming"]

[dependencies]
zip = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }

[dev-dependencies]
