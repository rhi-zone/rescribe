[package]
name = "epub-fmt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "EPUB2/EPUB3 reader/writer with a domain-typed package/manifest/spine/nav AST, built on zip-fmt (container) and html-fmt (XHTML content documents) — no rescribe dependency"
readme.workspace = true
keywords = ["epub", "ebook", "opf", "ocf"]
categories = ["encoding", "parser-implementations"]

[features]
default = ["reader-ast", "reader-streaming", "reader-batch", "writer-streaming", "writer-builder"]
reader-ast = []
reader-streaming = []
reader-batch = []
writer-streaming = []
writer-builder = ["reader-ast", "writer-streaming"]
# Umbrella convenience features: enable all reader or all writer modes at once.
read = ["reader-ast", "reader-streaming", "reader-batch"]
write = ["writer-builder", "writer-streaming"]
# AST<->rescribe::Document translation. Off by default so consumers who only
# want the standalone EPUB library never pull in rescribe-core. Pulls in
# translation code gated per-mode via cfg(all(feature = "<mode>", feature = "rescribe")).
rescribe = [
    "dep:rescribe-core",
    "dep:rescribe-std",
    "dep:zip",
    "dep:serde_json",
    "html-fmt/rescribe",
    "html-fmt/read",
    "html-fmt/write",
]

[dependencies]
quick-xml = { workspace = true }
zip-fmt = { workspace = true }
html-fmt = { workspace = true }
rescribe-format-api = { workspace = true }
rescribe-core = { workspace = true, optional = true }
rescribe-std = { workspace = true, optional = true }
# Only used by the `gen_fixtures` bin (fixture-file generation), gated behind
# the `rescribe` feature alongside it — never pulled in by the core library.
zip = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[[bin]]
name = "gen_fixtures"
required-features = ["rescribe"]

[dev-dependencies]
