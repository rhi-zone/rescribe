[package]
name = "typst-fmt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Typst markup parser, AST, and emitter — no rescribe dependency"

[features]
default = ["reader-ast", "reader-streaming", "reader-batch", "writer-streaming", "writer-builder"]
reader-ast = []
reader-streaming = []
reader-batch = []
writer-streaming = []
writer-builder = ["reader-ast", "writer-streaming"]
# Umbrella convenience features: enable all reader or all writer modes at once.
read = ["reader-ast", "reader-streaming", "reader-batch"]
write = ["writer-builder", "writer-streaming"]
# AST<->rescribe::Document translation. Off by default so consumers who only
# want the standalone Typst library never pull in rescribe-core. Pulls in
# translation code gated per-mode via cfg(all(feature = "<mode>", feature = "rescribe")).
rescribe = ["dep:rescribe-core", "dep:rescribe-std"]
# Full-compiler evaluation path (resolves #let/#for/#if/show rules, etc.) via
# the `typst` crate, on top of the syntax-only parse. Only meaningful together
# with `rescribe` (it produces a rescribe Document directly); adds
# crate::rescribe::parse_evaluated.
eval = ["dep:typst", "dep:typst-kit", "dep:typst-html", "reader-ast", "rescribe"]

[dependencies]
typst-syntax = { workspace = true }
rescribe-format-api = { workspace = true }
rescribe-core = { workspace = true, optional = true }
rescribe-std = { workspace = true, optional = true }
typst = { workspace = true, optional = true }
typst-kit = { workspace = true, optional = true }
typst-html = { workspace = true, optional = true }

[dev-dependencies]
