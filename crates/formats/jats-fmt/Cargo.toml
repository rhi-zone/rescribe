[package]
name = "jats-fmt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "JATS (Journal Article Tag Suite) XML parser, AST, and emitter — no rescribe dependency"

[features]
default = ["reader-ast", "reader-streaming", "reader-batch", "writer-streaming", "writer-builder"]
reader-ast = []
reader-streaming = []
reader-batch = []
writer-streaming = []
writer-builder = ["reader-ast", "writer-streaming"]
# Spec-derived construct registry: committed generated Rust statics, zero
# runtime parsing. Opt-in: a consumer that only wants to parse XML should not
# pay for the catalog. `serde` is kept only so the registry types can derive
# `Serialize`, for composing with a `rescribe query`/jaq-style consumer; it is
# not used to parse anything at runtime.
registry = ["dep:serde"]
# The registry derivation/verification tool. Needs the published JATS schema
# fetched locally (`scripts/jats/download-spec.sh`); not part of a normal
# build. `serde_json` here is a dev/tool-only dependency: it reads/writes the
# human-readable `registry/*.json` source and is never linked into a normal
# `registry`-feature build.
registry-derive = ["registry", "reader-ast", "dep:sha2", "dep:serde_json"]
# Umbrella convenience features: enable all reader or all writer modes at once.
read = ["reader-ast", "reader-streaming", "reader-batch"]
write = ["writer-builder", "writer-streaming"]
# AST<->rescribe::Document translation. Off by default so consumers who only
# want the standalone JATS library never pull in rescribe-core. Pulls in
# translation code gated per-mode via cfg(all(feature = "<mode>", feature = "rescribe")).
rescribe = ["dep:rescribe-core", "dep:rescribe-std"]

[dependencies]
quick-xml = { workspace = true }
xml-entities = { workspace = true }
rescribe-format-api = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
rescribe-core = { workspace = true, optional = true }
rescribe-std = { workspace = true, optional = true }

[[bin]]
name = "derive-registry"
required-features = ["registry-derive"]

[[test]]
name = "registry_coverage"
required-features = ["registry"]

[dev-dependencies]
