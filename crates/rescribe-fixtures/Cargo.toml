[package]
name = "rescribe-fixtures"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
rescribe-core = { workspace = true }
rescribe-fmt-pandoc-json = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
rescribe-format-api = { workspace = true }
# Our MIT fixture suite (tests/run.rs)
# Explicitly use pulldown-cmark backend for consistent behaviour; tree-sitter
# (the default) lacks YAML frontmatter, footnotes, and other GFM extensions.
rescribe-read-markdown = { workspace = true, features = ["pulldown"] }
rescribe-read-commonmark = { workspace = true }
rescribe-read-gfm = { workspace = true }

# Pandoc corpus harness (tests/pandoc.rs)
rescribe-fmt-pandoc-json = { workspace = true }
rescribe-read-latex = { workspace = true }
typst-fmt = { workspace = true, features = ["rescribe", "read", "write"] }
rescribe-fmt-ipynb = { workspace = true }
rescribe-fmt-csl-json = { workspace = true }
rescribe-fmt-bibtex = { workspace = true }
rescribe-fmt-biblatex = { workspace = true }
rescribe-fmt-ooxml = { workspace = true }
ooxml-sml = { workspace = true }
ooxml-wml = { workspace = true }
ooxml-pml = { workspace = true }
rescribe-fmt-pdf = { workspace = true }
multimarkdown-fmt = { workspace = true, features = ["rescribe", "read"] }

# Cross-API harness (tests/streaming_apis.rs): drives events()/StreamingParser/
# streaming-writer directly against the standalone -fmt crates, not just the
# rescribe adapter's parse()/emit().
rst-fmt = { workspace = true, features = ["rescribe", "read", "write"] }
org-fmt = { workspace = true, features = ["rescribe", "read", "write"] }
html-fmt = { workspace = true, features = ["rescribe", "read", "write"] }
