[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/rescribe",
    "crates/rescribe-core",
    "crates/nodes/*",
    "crates/formats/*",
    "crates/bridges/*",
    "crates/readers/*",
    "crates/writers/*",
    "crates/tools/*",
    "crates/rescribe-transforms",
    "crates/rescribe-cli",
    "crates/rescribe-fixtures",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rhi-zone/rescribe"
readme = "README.md"

[workspace.dependencies]
# Internal crates
rescribe-core = { path = "crates/rescribe-core" }
rescribe-format-api = { path = "crates/formats/rescribe-format-api" }
rescribe-std = { path = "crates/nodes/rescribe-std" }
rescribe-math = { path = "crates/nodes/rescribe-math" }
rescribe-read-markdown = { path = "crates/readers/rescribe-read-markdown" }
rescribe-write-markdown = { path = "crates/writers/rescribe-write-markdown" }
rescribe-read-html = { path = "crates/readers/rescribe-read-html" }
rescribe-read-latex = { path = "crates/readers/rescribe-read-latex" }
rescribe-write-html = { path = "crates/writers/rescribe-write-html" }
rescribe-write-plaintext = { path = "crates/writers/rescribe-write-plaintext" }
rescribe-write-latex = { path = "crates/writers/rescribe-write-latex" }
rescribe-fmt-pandoc-json = { path = "crates/bridges/rescribe-fmt-pandoc-json" }
rescribe-fmt-pdf = { path = "crates/bridges/rescribe-fmt-pdf" }
rescribe-transforms = { path = "crates/rescribe-transforms" }
rescribe-fmt-ipynb = { path = "crates/bridges/rescribe-fmt-ipynb" }
rescribe-read-epub = { path = "crates/readers/rescribe-read-epub" }
rescribe-write-epub = { path = "crates/writers/rescribe-write-epub" }
rescribe-fmt-bibtex = { path = "crates/bridges/rescribe-fmt-bibtex" }
rescribe-fmt-ooxml = { path = "crates/bridges/rescribe-fmt-ooxml" }
rescribe-fmt-csl-json = { path = "crates/bridges/rescribe-fmt-csl-json" }
fb2-fmt = { path = "crates/formats/fb2-fmt" }
odf-fmt = { path = "crates/formats/odf-fmt" }
commonmark-fmt = { path = "crates/formats/commonmark-fmt" }
djot-fmt = { path = "crates/formats/djot-fmt" }
rtf-fmt = { path = "crates/formats/rtf-fmt" }
rst-fmt = { path = "crates/formats/rst-fmt" }
asciidoc = { path = "crates/formats/asciidoc" }
org-fmt = { path = "crates/formats/org-fmt" }
textile-fmt = { path = "crates/formats/textile-fmt" }
markua = { path = "crates/formats/markua" }
texinfo = { path = "crates/formats/texinfo" }
t2t = { path = "crates/formats/t2t" }
vimwiki-fmt = { path = "crates/formats/vimwiki-fmt" }
muse-fmt = { path = "crates/formats/muse-fmt" }
jira-fmt = { path = "crates/formats/jira-fmt" }
zimwiki = { path = "crates/formats/zimwiki" }
pod-fmt = { path = "crates/formats/pod-fmt" }
haddock-fmt = { path = "crates/formats/haddock-fmt" }
creole = { path = "crates/formats/creole" }
csv-fmt = { path = "crates/formats/csv-fmt" }
man-fmt = { path = "crates/formats/man-fmt" }
mediawiki-fmt = { path = "crates/formats/mediawiki-fmt" }
fountain-fmt = { path = "crates/formats/fountain-fmt" }
twiki = { path = "crates/formats/twiki" }
tikiwiki = { path = "crates/formats/tikiwiki" }
xwiki = { path = "crates/formats/xwiki" }
bbcode-fmt = { path = "crates/formats/bbcode-fmt" }
dokuwiki = { path = "crates/formats/dokuwiki" }
ansi-fmt = { path = "crates/formats/ansi-fmt" }
html-fmt = { path = "crates/formats/html-fmt" }
docbook-fmt = { path = "crates/formats/docbook-fmt" }
jats-fmt = { path = "crates/formats/jats-fmt" }
tei-fmt = { path = "crates/formats/tei-fmt" }
opml-fmt = { path = "crates/formats/opml-fmt" }
endnotexml-fmt = { path = "crates/formats/endnotexml-fmt" }
typst-fmt = { path = "crates/formats/typst-fmt" }
multimarkdown-fmt = { path = "crates/formats/multimarkdown-fmt" }
ris = { path = "crates/formats/ris" }
native = { path = "crates/formats/native" }
tsv-fmt = { path = "crates/formats/tsv-fmt" }
xml-entities = { path = "crates/formats/xml-entities" }
zip-fmt = { path = "crates/formats/zip-fmt" }
epub-fmt = { path = "crates/formats/epub-fmt" }
rescribe-write-revealjs = { path = "crates/writers/rescribe-write-revealjs" }
rescribe-write-slidy = { path = "crates/writers/rescribe-write-slidy" }
rescribe-write-s5 = { path = "crates/writers/rescribe-write-s5" }
rescribe-write-dzslides = { path = "crates/writers/rescribe-write-dzslides" }
rescribe-write-beamer = { path = "crates/writers/rescribe-write-beamer" }
rescribe-write-context = { path = "crates/writers/rescribe-write-context" }
rescribe-write-ms = { path = "crates/writers/rescribe-write-ms" }
rescribe-write-chunkedhtml = { path = "crates/writers/rescribe-write-chunkedhtml" }
rescribe-write-icml = { path = "crates/writers/rescribe-write-icml" }
rescribe-write-slideous = { path = "crates/writers/rescribe-write-slideous" }
rescribe-read-commonmark = { path = "crates/readers/rescribe-read-commonmark" }
rescribe-write-commonmark = { path = "crates/writers/rescribe-write-commonmark" }
rescribe-read-gfm = { path = "crates/readers/rescribe-read-gfm" }
rescribe-write-gfm = { path = "crates/writers/rescribe-write-gfm" }
rescribe-fmt-biblatex = { path = "crates/bridges/rescribe-fmt-biblatex" }
rescribe-read-markdown-strict = { path = "crates/readers/rescribe-read-markdown-strict" }
rescribe-write-markdown-strict = { path = "crates/writers/rescribe-write-markdown-strict" }

# CLI crate
rescribe = { path = "crates/rescribe" }

# Test infrastructure
rescribe-fixtures = { path = "crates/rescribe-fixtures" }

# ooxml internal crates
ooxml-opc = { path = "crates/formats/ooxml-opc" }
ooxml-xml = { path = "crates/formats/ooxml-xml" }
ooxml-dml = { path = "crates/formats/ooxml-dml" }
ooxml-omml = { path = "crates/formats/ooxml-omml" }
ooxml-wml = { path = "crates/formats/ooxml-wml" }
ooxml-sml = { path = "crates/formats/ooxml-sml" }
ooxml-pml = { path = "crates/formats/ooxml-pml" }
ooxml-codegen = { path = "crates/tools/ooxml-codegen" }
ooxml-corpus = { path = "crates/tools/ooxml-corpus" }
ooxml-fixtures = { path = "crates/tools/ooxml-fixtures" }

# External dependencies
typst-syntax = "0.14"
typst = "0.14"
typst-kit = { version = "0.14", default-features = false, features = ["fonts"] }
typst-html = "0.14"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
pulldown-cmark = "0.13"
html5ever = "0.36"
markup5ever_rcdom = "0.36"
pdf-extract = "0.10"
quick-xml = { version = "0.39", features = ["serialize"] }
entities = "1"
toml = "0.8"
zip = "7"
flate2 = "1"
base64 = "0.22"
jaq-core = "3.1.0"
jaq-std = "3.0.1"
jaq-json = { version = "2.0.1", features = ["serde"] }
rayon = "1"
insta = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
criterion = { version = "0.5", features = ["html_reports"] }

[profile.dev]
debug = 0
