# NOTE (2026-08-05): this file used to `include = ["config.local.toml"]` to
# pull in a machine-local shared target-dir written by
# scripts/setup-worktree-target.sh / .ps1. That mechanism never actually
# worked: `include` requires the unstable `-Z config-include` flag on the
# cargo actually installed here (1.91.1) -- confirmed by direct
# reproduction (CARGO_LOG tracing showed config.local.toml was never
# loaded, plus an isolated scratch-dir repro). Every worktree silently fell
# back to building its own full local target/, which filled the machine's
# disk to ~100% with ~137GB of duplicated build output across 11 concurrent
# worktrees. Replaced with a symlink/junction-based mechanism that needs no
# cargo config at all: scripts/setup-worktree-target.sh / .ps1 now make
# each worktree's target/ a real filesystem link to the main checkout's
# target/, so cargo just writes into it normally. See those scripts and
# CLAUDE.md's "Development" section for details. The `include` line is
# removed here rather than left in place, since it never did anything on
# this toolchain and its presence implied otherwise.

# Reduce target/ directory bloat
[profile.dev]
debug = 1  # 0=none, 1=line tables, 2=full

[profile.release]
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2  # Optimize deps even in dev builds

# For faster builds with mold linker (local only), uncomment:
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]
