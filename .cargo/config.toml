# NOTE: deliberately NOT setting [build] target-dir here. A relative
# target-dir is resolved against the location of whichever config file
# supplies it, and this file is git-tracked — so once any git worktree is
# created from a commit that includes a `target-dir = "..."` line here, that
# worktree's own (closer) copy of this file would win outright and resolve
# the path against *its own* root, creating a fresh local target/ instead of
# sharing one. That defeats the point for every future worktree. The shared
# target dir is instead set dynamically via CARGO_TARGET_DIR in .envrc,
# computed from `git rev-parse --git-common-dir` — see .envrc for why that's
# safe across worktrees and this isn't.

# Reduce target/ directory bloat
[profile.dev]
debug = 1  # 0=none, 1=line tables, 2=full

[profile.release]
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2  # Optimize deps even in dev builds

# For faster builds with mold linker (local only), uncomment:
# [target.x86_64-unknown-linux-gnu]
# linker = "clang"
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]
